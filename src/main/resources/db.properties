# Database configuration for the COTIZIA application.
# Override any property with an environment variable by converting dots to underscores.
# Example: DB_URL, DB_USER, DB_PASSWORD

db.driverClassName=com.mysql.cj.jdbc.Driver
# JDBC URL used by HikariCP
# Update host, database name, timezone, and SSL settings as necessary.
db.url=jdbc:mysql://localhost:3306/gestion_cotisation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

db.user=root
# If your database has a password, set it here or override with environment variable DB_PASSWORD.
db.password=

db.pool.maxPoolSize=10
db.pool.minimumIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.cachePrepStmts=true
db.pool.prepStmtCacheSize=250
db.pool.prepStmtCacheSqlLimit=2048
